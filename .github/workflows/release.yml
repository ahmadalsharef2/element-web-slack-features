# Builds LiberMsg for Linux, Windows, macOS and Android and attaches the installers to a GitHub release. The web app goes
# to GitHub Pages, so phones (and any browser) can open it and add it to the home screen.
# Start it by pushing a tag (`git tag v1.0.0 && git push origin v1.0.0`) or from the Actions tab.
name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: linux, os: ubuntu-24.04 }
                    - { name: windows, os: windows-latest }
                    - { name: mac-arm64, os: macos-latest }
                    - { name: mac-x64, os: macos-15-intel }
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            # The repo pins pnpm in devEngines, so install that exact version
            - run: corepack enable && corepack prepare pnpm@11.23.0 --activate

            - run: pnpm install --frozen-lockfile

            - name: Build the web app
              working-directory: apps/web
              env:
                  NX_TUI: "false"
              run: |
                  pnpm build
                  cp ../desktop/element.io/release/config.json webapp/config.json

            # build/icon.icon is an Icon Composer file, which only the actool from Xcode 26 or later can compile
            - name: Select Xcode 26
              if: startsWith(matrix.name, 'mac-')
              run: |
                  xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
                  sudo xcode-select -s "$xcode"
                  xcrun actool --version

            # The release job publishes the installers, so stop electron-builder from publishing on a tag push
            - name: Build the desktop app
              working-directory: apps/desktop
              env:
                  NX_TUI: "false"
              run: |
                  pnpm exec asar p ../web/webapp webapp.asar
                  pnpm exec nx build --skip-nx-cache -- --publish=never

            - name: Collect installers
              run: |
                  mkdir out
                  cd apps/desktop/dist
                  case "${{ matrix.name }}" in
                      linux)
                          cp *.deb *.tar.gz ../../../out/
                          # The web app itself, for phones (GitHub Pages) and for hosting it on your own server
                          tar -czf ../../../out/libermsg-web.tar.gz -C ../../web webapp
                          ;;
                      windows) cp squirrel-windows/*Setup*.exe *.msi ../../../out/ ;;
                      mac-*) for f in *.dmg; do cp "$f" "../../../out/${f%.dmg}-${{ matrix.name }}.dmg"; done ;;
                  esac
                  ls -la ../../../out

            - uses: actions/upload-artifact@v6
              with:
                  name: installers-${{ matrix.name }}
                  path: out/*
                  if-no-files-found: error

    # The Android app wraps the web app the Linux build made, in the Capacitor shell under mobile/
    android:
        name: Build (android)
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            # Capacitor 8 compiles for Java 21; the runner already has the Android SDK
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21

            - uses: actions/download-artifact@v7
              with:
                  name: installers-linux
                  path: linux

            - name: Build the APK
              working-directory: mobile
              run: |
                  tar -xzf ../linux/libermsg-web.tar.gz
                  mv webapp www
                  npm ci --no-audit --no-fund
                  npx cap sync android
                  cd android
                  ./gradlew assembleDebug
                  mkdir -p ../../out
                  cp app/build/outputs/apk/debug/app-debug.apk "../../out/libermsg-${{ github.ref_name }}.apk"

            - uses: actions/upload-artifact@v6
              with:
                  name: installers-android
                  path: out/*
                  if-no-files-found: error

    release:
        name: Publish release
        needs: [build, android]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v7
              with:
                  path: out
                  pattern: installers-*
                  merge-multiple: true

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: gh release create "${{ github.ref_name }}" out/* --title "LiberMsg ${{ github.ref_name }}" --generate-notes

    pages:
        name: Publish the web app (phones and browsers)
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-24.04
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            # Deploying fails when Pages is off for the repo, so skip it with a warning rather than fail the release.
            # Turn it on under Settings → Pages → Source: GitHub Actions.
            - name: Check that GitHub Pages is on
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh api "repos/${{ github.repository }}/pages" --silent; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::GitHub Pages is off for this repo, so the web app was not published. Turn it on under Settings → Pages → Source: GitHub Actions."
                  fi

            - uses: actions/download-artifact@v7
              if: steps.check.outputs.enabled == 'true'
              with:
                  name: installers-linux
                  path: out

            - if: steps.check.outputs.enabled == 'true'
              run: tar -xzf out/libermsg-web.tar.gz

            - uses: actions/upload-pages-artifact@v4
              if: steps.check.outputs.enabled == 'true'
              with:
                  path: webapp

            - id: deploy
              if: steps.check.outputs.enabled == 'true'
              uses: actions/deploy-pages@v5
